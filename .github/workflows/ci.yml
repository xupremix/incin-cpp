name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache libtorch
        id: cache-libtorch
        uses: actions/cache@v4
        with:
          path: libtorch
          key: libtorch-2.5.1-cpu-${{ runner.os }}

      - name: Download libtorch
        if: steps.cache-libtorch.outputs.cache-hit != 'true'
        run: |
          curl -L -o libtorch.zip \
            'https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.5.1%2Bcpu.zip'
          unzip -q libtorch.zip
          rm libtorch.zip

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify the installed package is relocatable
        run: |
          prefix="$RUNNER_TEMP/incin-cpp-install"
          moved="$RUNNER_TEMP/incin-cpp-moved"
          cmake --install build --prefix "$prefix"

          # The installed package must not embed paths from the build machine.
          if grep -R -F "$GITHUB_WORKSPACE" "$prefix"; then
            echo "installed package embeds build-host paths" >&2
            exit 1
          fi

          # Relocate the install prefix and build the consumer from its new
          # location, using only find_package(incin-cpp) and libtorch.
          rm -rf "$moved"
          mv "$prefix" "$moved"
          cmake -S tests/consumer -B "$RUNNER_TEMP/consumer-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$moved;$GITHUB_WORKSPACE/libtorch"
          cmake --build "$RUNNER_TEMP/consumer-build" -j"$(nproc)"
          "$RUNNER_TEMP/consumer-build/incin_consumer"
